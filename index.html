<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arıza Takip Sistemi</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --success: #16a34a;
            --warning: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-light);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            padding: 25px;
            margin-bottom: 30px;
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-dusuk { background-color: #e2e8f0; color: #475569; }
        .badge-normal { background-color: #fef08a; color: #854d0e; }
        .badge-kritik { background-color: #fee2e2; color: #991b1b; }

        .badge-acik { background-color: #fee2e2; color: var(--danger); }
        .badge-kapali { background-color: #dcfce7; color: var(--success); }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        .btn-secondary {
            background-color: #64748b;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: #b91c1c;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Arıza Takip Sistemi</h1>
            <p>Arızalarınızı kaydedin, önceliklendirin ve takip edin.</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <h3>Toplam Kayıt</h3>
                <div class="number" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Açık Arıza</h3>
                <div class="number" id="openCount" style="color: var(--danger);">0</div>
            </div>
            <div class="stat-card">
                <h3>Çözülen</h3>
                <div class="number" id="resolvedCount" style="color: var(--success);">0</div>
            </div>
        </div>

        <div class="card">
            <h2 id="formTitle">Yeni Arıza Kaydı</h2>
            <form id="faultForm">
                <input type="hidden" id="faultId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Arıza Başlığı</label>
                        <input type="text" id="title" required placeholder="Örn: 3 Nolu Klima Arızası">
                    </div>
                    <div class="form-group">
                        <label for="priority">Öncelik Derecesi</label>
                        <select id="priority">
                            <option value="Düşük">Düşük</option>
                            <option value="Normal" selected>Normal</option>
                            <option value="Kritik">Kritik</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">Açıklama / Detay</label>
                    <textarea id="description" placeholder="Arızanın detaylarını ve konumunu yazın..."></textarea>
                </div>
                <button type="submit" class="btn" id="submitBtn">Arızayı Kaydet</button>
                <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none; margin-left: 10px;">İptal</button>
            </form>
        </div>

        <div class="card">
            <h2>Arıza Listesi</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Başlık</th>
                            <th>Açıklama</th>
                            <th>Öncelik</th>
                            <th>Durum</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="faultTableBody">
                        <!-- Kayıtlar buraya gelecek -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'ariza_takip_verileri';
        let faults = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let editingId = null;

        const form = document.getElementById('faultForm');
        const titleInput = document.getElementById('title');
        const descInput = document.getElementById('description');
        const priorityInput = document.getElementById('priority');
        const faultIdInput = document.getElementById('faultId');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const tableBody = document.getElementById('faultTableBody');
        
        const totalCountEl = document.getElementById('totalCount');
        const openCountEl = document.getElementById('openCount');
        const resolvedCountEl = document.getElementById('resolvedCount');

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(faults));
        }

        function render() {
            tableBody.innerHTML = '';

            if (faults.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="empty-state">Henüz kayıtlı arıza yok.</td></tr>`;
                updateStats();
                return;
            }

            faults.forEach((f, idx) => {
                const tr = document.createElement('tr');
                
                let priorityClass = 'badge-normal';
                if (f.priority === 'Düşük') priorityClass = 'badge-dusuk';
                if (f.priority === 'Kritik') priorityClass = 'badge-kritik';

                let statusClass = f.status === 'acik' ? 'badge-acik' : 'badge-kapali';
                let statusText = f.status === 'acik' ? 'Açık' : 'Çözüldü';

                tr.innerHTML = `
                    <td style="font-weight: 600;">${escapeHtml(f.title)}</td>
                    <td>${escapeHtml(f.description)}</td>
                    <td><span class="badge ${priorityClass}">${f.priority}</span></td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-sm btn-secondary" data-action="toggle" data-id="${f.id}">Durum Değiştir</button>
                            <button class="btn btn-sm" data-action="edit" data-id="${f.id}">Düzenle</button>
                            <button class="btn btn-sm btn-danger" data-action="delete" data-id="${f.id}">Sil</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            updateStats();
        }

        function updateStats() {
            totalCountEl.textContent = faults.length;
            const openCount = faults.filter(f => f.status === 'acik').length;
            openCountEl.textContent = openCount;
            resolvedCountEl.textContent = faults.length - openCount;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const title = titleInput.value.trim();
            const description = descInput.value.trim();
            const priority = priorityInput.value;

            if (!title) return;

            if (editingId !== null) {
                const fault = faults.find(f => f.id === editingId);
                if (fault) {
                    fault.title = title;
                    fault.description = description;
                    fault.priority = priority;
                }
                resetForm();
            } else {
                const newFault = {
                    id: Date.now().toString(),
                    title,
                    description,
                    priority,
                    status: 'acik'
                };
                faults.unshift(newFault);
            }

            save();
            render();
            form.reset();
        });

        tableBody.addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (!btn) return;

            const id = btn.getAttribute('data-id');
            const idx = faults.findIndex(f => f.id === id);
            if (idx === -1) return;

            const action = btn.getAttribute('data-action');

            if (action === 'toggle') {
                faults[idx].status = faults[idx].status === 'acik' ? 'kapali' : 'acik';
                save();
                render();
            } else if (action === 'edit') {
                startEdit(id);
            } else if (action === 'delete') {
                if (confirm(`"${faults[idx].title}" arızası silinsin mi?`)) {
                    if (editingId === id) resetForm();
                    faults.splice(idx, 1);
                    save();
                    render();
                }
            }
        });

        function startEdit(id) {
            const fault = faults.find(f => f.id === id);
            if (!fault) return;

            editingId = id;
            titleInput.value = fault.title;
            descInput.value = fault.description;
            priorityInput.value = fault.priority;

            formTitle.textContent = "Arızayı Düzenle";
            submitBtn.textContent = "Güncelle";
            cancelBtn.style.display = 'inline-block';
            titleInput.focus();
        }

        function resetForm() {
            editingId = null;
            form.reset();
            formTitle.textContent = "Yeni Arıza Kaydı";
            submitBtn.textContent = "Arızayı Kaydet";
            cancelBtn.style.display = 'none';
        }

        cancelBtn.addEventListener('click', resetForm);

        render();
    </script>
</body>
</html>
